<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Admin Panel - RNexa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }
        
        .form-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }
        
        .form-group input,
        .form-group select {
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }
        
        .conditional-fields {
            background: #fff;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
            display: none;
        }
        
        .conditional-fields.show {
            display: block;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .hotels-list {
            margin-top: 30px;
        }
        
        .hotel-card {
            background: white;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: box-shadow 0.3s;
        }
        
        .hotel-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .hotel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .hotel-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
        }
        
        .hotel-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-small {
            padding: 8px 15px;
            font-size: 14px;
        }
        
        .hotel-details {
            color: #666;
            line-height: 1.6;
        }
        
        .restaurant-badge {
            background: #28a745;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 10px;
        }
        
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Hotel Admin Panel</h1>
            <p>Manage hotels and restaurant information</p>
        </div>
        
        <div class="content">
            <div id="message"></div>
            
            <div class="form-section">
                <h2>Add New Hotel</h2>
                <form id="hotel-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="hotel-name">Hotel Name *</label>
                            <input type="text" id="hotel-name" name="name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="hotel-address">Address *</label>
                            <input type="text" id="hotel-address" name="address" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="hotel-phone">Phone Number *</label>
                            <input type="tel" id="hotel-phone" name="phone" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="hotel-email">Email</label>
                            <input type="email" id="hotel-email" name="email">
                        </div>
                    </div>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="has-restaurant" name="hasRestaurant">
                        <label for="has-restaurant">This hotel has a restaurant</label>
                    </div>
                    
                    <div id="restaurant-fields" class="conditional-fields">
                        <h3>Restaurant Details</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="restaurant-name">Restaurant Name *</label>
                                <input type="text" id="restaurant-name" name="restaurantName">
                            </div>
                            
                            <div class="form-group">
                                <label for="restaurant-type">Restaurant Type</label>
                                <select id="restaurant-type" name="restaurantType">
                                    <option value="">Select type</option>
                                    <option value="fine-dining">Fine Dining</option>
                                    <option value="casual">Casual Dining</option>
                                    <option value="cafe">Cafe</option>
                                    <option value="bar">Bar & Lounge</option>
                                    <option value="buffet">Buffet</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="restaurant-hours">Opening Hours</label>
                                <input type="text" id="restaurant-hours" name="restaurantHours" placeholder="e.g., 11:00 AM - 11:00 PM">
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn">Add Hotel</button>
                </form>
            </div>
            
            <div class="hotels-list">
                <h2>Existing Hotels</h2>
                <div id="hotels-container"></div>
            </div>
        </div>
    </div>

    <script>
        let hotels = [];
        
        // Show/hide restaurant fields based on checkbox
        document.getElementById('has-restaurant').addEventListener('change', function() {
            const restaurantFields = document.getElementById('restaurant-fields');
            if (this.checked) {
                restaurantFields.classList.add('show');
                document.getElementById('restaurant-name').required = true;
            } else {
                restaurantFields.classList.remove('show');
                document.getElementById('restaurant-name').required = false;
            }
        });
        
        // Form submission
        document.getElementById('hotel-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const hotelData = Object.fromEntries(formData.entries());
            
            // Convert checkbox to boolean
            hotelData.hasRestaurant = document.getElementById('has-restaurant').checked;
            
            try {
                const response = await fetch('/api/hotels', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(hotelData)
                });
                
                if (response.ok) {
                    showMessage('Hotel added successfully!', 'success');
                    this.reset();
                    document.getElementById('restaurant-fields').classList.remove('show');
                    loadHotels();
                } else {
                    showMessage('Failed to add hotel. Please try again.', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        });
        
        // Load hotels
        async function loadHotels() {
            try {
                const response = await fetch('/api/hotels');
                hotels = await response.json();
                displayHotels();
            } catch (error) {
                console.error('Error loading hotels:', error);
            }
        }
        
        // Display hotels
        function displayHotels() {
            const container = document.getElementById('hotels-container');
            
            if (hotels.length === 0) {
                container.innerHTML = '<p>No hotels added yet.</p>';
                return;
            }
            
            container.innerHTML = hotels.map(hotel => `
                <div class="hotel-card">
                    <div class="hotel-header">
                        <div>
                            <span class="hotel-name">${hotel.name}</span>
                            ${hotel.hasRestaurant ? '<span class="restaurant-badge">Restaurant</span>' : ''}
                        </div>
                        <div class="hotel-actions">
                            <button class="btn btn-small btn-secondary" onclick="editHotel('${hotel.id}')">Edit</button>
                            <button class="btn btn-small" onclick="deleteHotel('${hotel.id}')">Delete</button>
                        </div>
                    </div>
                    <div class="hotel-details">
                        <p><strong>Address:</strong> ${hotel.address}</p>
                        <p><strong>Phone:</strong> ${hotel.phone}</p>
                        ${hotel.email ? `<p><strong>Email:</strong> ${hotel.email}</p>` : ''}
                        ${hotel.hasRestaurant ? `
                            <p><strong>Restaurant:</strong> ${hotel.restaurantName}</p>
                            ${hotel.restaurantType ? `<p><strong>Type:</strong> ${hotel.restaurantType}</p>` : ''}
                            ${hotel.restaurantHours ? `<p><strong>Hours:</strong> ${hotel.restaurantHours}</p>` : ''}
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }
        
        // Delete hotel
        async function deleteHotel(id) {
            if (!confirm('Are you sure you want to delete this hotel?')) return;
            
            try {
                const response = await fetch(`/api/hotels/${id}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    showMessage('Hotel deleted successfully!', 'success');
                    loadHotels();
                } else {
                    showMessage('Failed to delete hotel.', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        // Show message
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }
        
        // Initialize
        loadHotels();
    </script>
</body>
</html>
